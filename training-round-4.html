ns implementation skill 4 and thinking skill 4. Ashley\n\t\t\tmust meet <em>both</em> difficulties before solving a problem. Only then does she increase one skill\n\t\t\tby 1.</p> <p>If she starts at <code>(4, 4)</code>, solving one problem can leave her at <code>(5, 4)</code> or <code>(4, 5)</code>. It cannot leave her at <code>(5, 5)</code>.</p></section> <section aria-labelledby="explore" class="space-y-4"><h2 id="explore" class="text-2xl font-semibold">Choose two upgrades</h2> <p>For this exercise, assume each problem is easy enough to solve. Choose which skill increases\n\t\t\tafter each problem.</p> <div class="flex flex-wrap gap-2"><!> <!> <!></div> <p aria-live="polite" data-testid="current"> </p> <figure class="mx-auto max-w-sm"><svg viewBox="0 0 300 235" role="img" aria-labelledby="tree-title tree-description" class="w-full"><title id="tree-title">Skill pairs after zero, one, and two upgrades</title><desc id="tree-description">Start at 4,4. One upgrade reaches 4,5 or 5,4. Two reach 4,6 or 5,5 or 6,4. Both orders of\n\t\t\t\t\tone upgrade to each skill reach 5,5.</desc><g class="stroke-muted-foreground" stroke-width="1.5"><path d="M150 35 L75 115 L25 195 M150 35 L225 115 L275 195 M75 115 L150 195 L225 115" fill="none"></path></g><!></svg> <figcaption class="text-sm text-muted-foreground">After two upgrades the possible pairs are (4, 6), (5, 5), and (6, 4). Every pair totals 10.</figcaption></figure> <p>Try implementation then thinking. Reset and reverse the order. Both finish at <code>(5, 5)</code>. Once Ashley reaches the same pair at the same position in the list, her future options are\n\t\t\tthe same.</p></section> <section aria-labelledby="state" class="space-y-3"><h2 id="state" class="text-2xl font-semibold">Count what changed</h2> <p>Suppose the starting skills are <code>I</code> and <code>T</code>. After solving <code>k</code> problems, Ashley has received exactly <code>k</code> upgrades.</p> <div class="border-l-2 border-chart-1 pl-4"><p>Total skill = <code>I + T + k</code></p> <p>If <code>x</code> upgrades went to implementation, the other <code>k − x</code> went to thinking.</p> <p>Current skills = <code>(I + x, T + k − x)</code></p></div> <p>For a fixed starting pair, we can describe the current skills using just <code>k</code> and <code>x</code>. We do not need to store the whole sequence of upgrade choices.</p> <p>We still must check earlier problems. Two sequences can end at the same pair even though only\n\t\t\tone sequence could solve every problem on the way there. A DP would keep pairs that Ashley can\n\t\t\tactually reach.</p></section> <section aria-labelledby="practice" class="space-y-3"><h2 id="practice" class="text-2xl font-semibold">Check the observation</h2> <p>Ashley starts at <code>(4, 4)</code> and solves three problems. What is her total skill afterward?</p> <form class="space-y-3"><label for="answer" class="block">Total skill</label> <input id="answer" type="number" required="" class="w-32 rounded-md border border-input bg-background p-2"/> <!> <p aria-live="polite" data-testid="feedback"> </p></form></section> <section aria-labelledby="next" class="space-y-3"><h2 id="next" class="text-2xl font-semibold">What we still need to solve</h2> <p>This observation handles a <em>fixed</em> starting pair. The actual problem asks us to choose that\n\t\t\tpair and minimize its sum. We will tackle that next.</p> <p>Come back to the chat with your answer: if <code>k = 5</code> and <code>x = 2</code>, how many\n\t\t\tupgrades went to thinking? Ask me about any step that is unclear.</p></section> <footer class="space-y-2 border-t pt-5 text-sm text-muted-foreground"><p>The rules and examples come from the problem statement you supplied. The equations above\n\t\t\tfollow by counting its one-upgrade rule.</p> <p>Optional reading: the <a class="underline" href="https://pnw.na.icpc.global/problems/2025/solutions/">official contest archive</a> has the original materials. Judge solutions contain spoilers. Star
